name: Publish package to PyPI
# on:
#   push:
#     branches:
#       - 'main'
#     paths:
#       - 'gptcache/**'
#       - '!**.md'
#       - '.github/workflows/publish_dev_package.yaml'
#   pull_request:
#     branches:
#       - main
