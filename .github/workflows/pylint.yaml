name: Pylint
on:
  push:
    branches:
      - main
      - dev
      # file paths to consider in the event
    paths:
      - 'examples/**'
      - 'gptcache/**'
      - 'tests/**'
      - 'docs/**'
      - '!**.md'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - dev
      # file paths to consider in the event
    paths:
      - 'examples/**'
      - 'gptcache/**'
      - 'tests/**'
      - 'docs/**'
      - '!**.md'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  pylint:
    runs-on: ubuntu-20.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - uses: actions/checkout@a12a3943b4bdde767164f792f33f40b04645d846 # v3.0.0
    - name: Setup Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: 3.8
    - name: Python pylint
      run: |
        pip install pylint==2.10.2
        make pylint_check
    - name: Make the readthedoc html
      shell: bash
      working-directory: docs
      run: |
        pip install -r requirements.txt
        make html
