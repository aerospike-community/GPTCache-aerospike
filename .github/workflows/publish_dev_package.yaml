name: Publish package to TestPyPI
# on:
#   push:
#     branches:
#       - 'main'
#     paths:
#       - 'gptcache/**'
#       - '!**.md'
#       - '.github/workflows/publish_dev_package.yaml'
#   pull_request:
#     branches:
#       - main
#     paths:
#       - '.github/workflows/publish_dev_package.yaml'
on:
  workflow_dispatch:

  schedule:
    # * is a special character in YAML so you have to quote this string
    #         ┌───────────── minute (0 - 59)
    #         │ ┌───────────── hour (0 - 23)
    #         │ │ ┌───────────── day of the month (1 - 31)
    #         │ │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    #         │ │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    #         │ │ │ │ │
    #         │ │ │ │ │
    #         │ │ │ │ │
    - cron:  '30 9 * * 1,4'


jobs:
  build-and-publish-dev:
    runs-on: ubuntu-20.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - name: Setup Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: 3.8
    # - name: Get history and tags for SCM versioning
    #   run: |
    #       git fetch --prune --unshallow
    #       git fetch --depth=1 origin +refs/tags/*:refs/tags/*
    - name: Install pypi/build
      run: >-
        python -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: >-
        python -m
        build
        --sdist
        --wheel
        --outdir dist/
        .
    - name: Publish distribution 📦 to Test PyPI
      uses: pypa/gh-action-pypi-publish@c1b34028248d0c9f7d90fe29fef2122e2276ff6f # master
      with:
        password: ${{ secrets.PYPI_TEST_TOKEN }}
        repository_url: https://test.pypi.org/legacy/
