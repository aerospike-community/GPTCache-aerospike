name: Publish image to dockerhub
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish-image:
    runs-on: ubuntu-20.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: Checkout 
      uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

    - name: Get version
      id: get_version
      run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}

    - name: Docker Build
      shell: bash
      run: |
        docker build "./gptcache_server/dockerfiles" -t "zilliz/gptcache:${{ steps.get_version.outputs.VERSION }}"

    - name: Docker login 
      if: success()
      uses: azure/docker-login@83efeb77770c98b620c73055fbb59b2847e17dc0 # v1.0.1
      with:
        username: ${{ secrets.ZILLIZ_DOCKERHUB_USERNAME }} 
        password: ${{ secrets.ZILLIZ_DOCKERHUB_PASSWORD }}

    - name: Docker Push
      if: success()
      continue-on-error: false
      shell: bash
      run: |
        docker push zilliz/gptcache:${{ steps.get_version.outputs.VERSION }}
        docker tag zilliz/gptcache:${{ steps.get_version.outputs.VERSION }} zilliz/gptcache:latest
        docker push zilliz/gptcache:latest